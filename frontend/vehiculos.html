<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vehículos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<script>
  if (!localStorage.getItem('token')) {
    window.location.href = 'login.html';
  }
</script>

<button onclick="window.location.href='index.html'">
  ⬅ Volver
</button>

<h1>Vehículos</h1>

<div class="card">
  <h3>Nuevo vehículo</h3>

  <input id="vin" placeholder="VIN">
  <input id="marca" placeholder="Marca">
  <input id="modelo" placeholder="Modelo">
  <input id="anio" placeholder="Año">
  <input id="color" placeholder="Color">
  <input id="placas" placeholder="Placas">
  <input id="kms" placeholder="Kilometraje">
  <select id="cliente_id"></select>

  <button onclick="crearVehiculo()">Guardar vehículo</button>
  <p id="msg"></p>
</div>

<script src="vehiculos.js"></script>

</body>
</html>
